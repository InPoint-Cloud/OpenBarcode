name: Release

# Publishes InPoint.Cloud.OpenBarcode to nuget.org when a tag like v1.2.3
# (or v1.2.3-beta.1) is pushed. Authentication uses nuget.org Trusted Publishing, so no API key is stored here.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # nuget.org Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet build -c Release -p:Version=$VERSION
      - run: dotnet test -c Release --no-build
      - run: dotnet pack -c Release --no-build -p:Version=$VERSION -o artifacts

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg
          --title "$GITHUB_REF_NAME" --generate-notes
          $([[ "$VERSION" == *-* ]] && echo --prerelease)
